name: CI - Kiem tra code

on:
  pull_request:
    branches: [ main ]

jobs:
  check-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cai thu vien
        run: |
          pip install -r requirements.txt

      - name: Kiem tra loi cu phap Python
        run: |
          python -m py_compile *.py
